# Stage 7: Configuration management. Provision a real Ubuntu VM (cloud or local VM) and run:
#   ansible-playbook -i inventory.ini playbook.yml
# (Ansible runs on Linux/macOS/WSL, not native Windows.)
- name: Deploy devops app to servers
  hosts: web
  become: true
  vars:
    image: ghcr.io/YOUR_GITHUB_USER/YOUR_REPO:latest
  tasks:
    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-requests # needed by the community.docker modules on the target
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run app container
      community.docker.docker_container:
        name: web
        image: "{{ image }}"
        state: started
        restart_policy: always
        pull: "{{ pull_image | default(true) | bool }}"  # set -e pull_image=false to use a locally loaded image
        published_ports: ["80:5000"]
        env:
          APP_VERSION: ansible
