# Stage 5: Kubernetes. Run locally with kind or minikube.
#   kind create cluster
#   kubectl apply -f k8s/        (the image is pulled from GHCR, no local build needed)
#   kubectl port-forward svc/web 8080:80
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  APP_VERSION: "k8s-v2"
  REDIS_HOST: "redis"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: data, mountPath: /data } # redis needs one writable dir; data is disposable here
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      # k8s injects env vars like REDIS_PORT=tcp://... for every Service; that clashes with our own config
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # matches the fixed UID in app/Dockerfile
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          # CI rewrites this tag to the commit SHA after every successful build; Argo CD then deploys it
          image: ghcr.io/eeshwar2712-gif/devopstest:45718a3d7f493a0aed542cf2d7223a80df413858
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: web-config }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          # read-only root filesystem: give gunicorn and the metrics library scratch space
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: metrics, mountPath: /tmp/metrics }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: metrics, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 5000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: web }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
