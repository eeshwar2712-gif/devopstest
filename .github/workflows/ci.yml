# CI/CD pipeline:
#   test + security scans  ->  build & push image  ->  write the new image tag into k8s/app.yaml
# Argo CD sees that commit and rolls the new image out to the cluster (GitOps).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - run: pytest app

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan every commit

      # 1. Secret scanning: fails if a password/token was committed
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Dependency + image vulnerability scanning: fails on fixable HIGH/CRITICAL issues
      - name: Build image for scanning
        run: docker build -t scan-target:ci ./app
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 3. Misconfiguration scanning of Dockerfile + Kubernetes manifests (report only)
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

  build-and-push:
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the new image tag back to the repo
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # GitOps hand-off: record exactly which image should run.
      # The commit message has [skip ci] so this commit does not trigger another pipeline run.
      - name: Update image tag in k8s manifest
        run: |
          sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" k8s/app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || {
            git commit -am "ci: deploy ${{ github.sha }} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
